[project]
name = "pilot-model-experiment"
version = "0.1.0"
description = "Experiment code for the Pilot Model: inference, pilot practice, and reproducible evaluation."
authors = [{ name = "Joshua Idele", email = "codewithjoshh@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.5",
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "scipy>=1.14.1",
    "statsmodels>=0.14.4",
    "matplotlib>=3.9.2",
]

[project.scripts]
pilot = "pilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilot"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.1",
    "bandit>=1.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# The scientific stack ships no type information; treat it as untyped
# rather than installing stub packages that lag the runtime versions.
[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*", "statsmodels.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
